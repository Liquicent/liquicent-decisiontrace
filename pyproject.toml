[project]
name = "liquicent-decisiontrace"
version = "0.0.1"
description = "Record why your AI made a decision, at the moment it's made. Local-first, tamper-evident decision traces."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Liquicent" }]
keywords = ["ai-agents", "audit-trail", "decision-trace", "claude-code", "mcp", "opentelemetry"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.21",
    "mcp>=1.10",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/vpsingh88/liquicent-decisiontrace"
Issues = "https://github.com/vpsingh88/liquicent-decisiontrace/issues"

[project.scripts]
dt = "decisiontrace.cli:app"

[project.optional-dependencies]
embeddings = [
    "model2vec>=0.6",
    "sqlite-vec>=0.1.6",
]
llm = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisiontrace"]

[tool.hatch.build.targets.wheel.force-include]
"schema/decisiontrace.schema.json" = "decisiontrace/_schema/decisiontrace.schema.json"

[tool.hatch.build.targets.sdist]
include = ["src", "schema", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Line length is the formatter's job (ruff's recommended setup); math docstrings use Greek.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/decisiontrace/recall/similarity.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["model2vec", "model2vec.*", "sqlite_vec"]
ignore_missing_imports = true
